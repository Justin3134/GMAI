<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cute dinosaur logo -->
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7FDB5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D9D78;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spikeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD966;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="320" cy="340" rx="140" ry="120" fill="url(#bodyGradient)"/>
  
  <!-- Tail -->
  <path d="M 440 340 Q 480 320 490 280 Q 495 250 480 230" stroke="url(#bodyGradient)" stroke-width="60" fill="none" stroke-linecap="round"/>
  
  <!-- Legs -->
  <ellipse cx="260" cy="420" rx="35" ry="50" fill="#2D9D78"/>
  <ellipse cx="360" cy="420" rx="35" ry="50" fill="#2D9D78"/>
  
  <!-- Neck and Head -->
  <ellipse cx="200" cy="280" rx="70" ry="85" fill="url(#bodyGradient)"/>
  <ellipse cx="180" cy="200" rx="75" ry="70" fill="url(#bodyGradient)"/>
  
  <!-- Spikes -->
  <path d="M 160 140 L 180 110 L 200 140 Z" fill="url(#spikeGradient)"/>
  <path d="M 190 150 L 205 125 L 220 150 Z" fill="url(#spikeGradient)"/>
  <path d="M 210 165 L 220 145 L 230 165 Z" fill="url(#spikeGradient)"/>
  <path d="M 220 185 L 227 170 L 235 185 Z" fill="url(#spikeGradient)"/>
  <path d="M 440 300 L 455 280 L 470 300 Z" fill="url(#spikeGradient)"/>
  <path d="M 460 270 L 472 252 L 484 270 Z" fill="url(#spikeGradient)"/>
  
  <!-- Eye -->
  <circle cx="220" cy="190" r="18" fill="white"/>
  <circle cx="225" cy="188" r="12" fill="#2D2D2D"/>
  <circle cx="228" cy="185" r="5" fill="white"/>
  
  <!-- Smile -->
  <path d="M 160 220 Q 170 235 185 230" stroke="#2D2D2D" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Play button overlay -->
  <circle cx="256" cy="300" r="60" fill="white" opacity="0.9"/>
  <path d="M 240 270 L 240 330 L 290 300 Z" fill="#2D9D78"/>
</svg>

